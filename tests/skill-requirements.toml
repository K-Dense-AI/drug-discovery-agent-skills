# Per-skill test environments.
#
# `python tests/run_all.py --isolated` builds one throwaway uv environment per
# skill from this file, so a skill whose upstream pins conflict with another's
# never has to share an interpreter. Nothing here is installed into the project
# environment, and `uv sync` is unaffected.
#
# Each skill's `packages` list is the set the skill's SKILL.md, references, and
# scripts actually name -- transitive dependencies are left to the resolver.
# Skills whose bundled tooling is standard-library only have `packages = []`;
# they still get a clean environment with just pytest.
#
# `python` overrides the interpreter for that skill alone. This is the reason
# per-skill environments are worth the trouble: PyTDC and DeepChem need 3.11,
# molfeat and torchdrug cap at 3.10. uv downloads the interpreter on demand.
#
# Packages listed under [unavailable] are documented by a skill but cannot be
# installed here at all; the reason is recorded so nobody re-derives it.

[defaults]
python = "3.13"

# --- knowledge graphs and target discovery --------------------------------

[skills.ncats-arax]
packages = []

[skills.depmap]
packages = ["numpy", "pandas", "requests", "scipy"]

[skills.primekg]
packages = ["pandas"]

# --- proteins: design, folding, and docking -------------------------------

[skills.glycoengineering]
packages = ["glycoshield", "pandas", "requests"]

[skills.esm]
packages = ["esm", "torch", "matplotlib", "numpy", "scikit-learn", "requests", "tqdm"]

[skills.diffdock]
packages = ["torch", "rdkit", "openmm", "esm", "pandas"]

# --- small molecules: cheminformatics and molecular ML --------------------

[skills.rdkit]
packages = ["rdkit"]

[skills.datamol]
packages = ["datamol", "rdkit", "s3fs", "gcsfs"]

[skills.medchem]
packages = ["medchem", "datamol", "rdkit", "pandas", "tqdm"]

[skills.molfeat]
python = "3.10"
packages = ["molfeat", "datamol", "torch"]

[skills.molecular-dynamics]
packages = ["mdanalysis", "openmm", "matplotlib", "numpy", "pandas", "scipy"]

[skills.rowan]
packages = ["rowan-python", "rdkit", "pandas"]

[skills.deepchem]
python = "3.11"
# torch is what the skill's own `compatibility` line and the `deepchem[torch]`
# install command require: without a backend, dc.models.GCNModel and friends do
# not exist, so no model path is reachable at all.
packages = ["deepchem", "torch", "numpy", "scikit-learn"]

[skills.pytdc]
python = "3.11"
packages = ["pytdc", "setuptools"]

[skills.tamarind]
packages = ["tamarind", "requests"]

[skills.adaptyv]
packages = []

[skills.torchdrug]
python = "3.10"
packages = ["torch"]

# --- packages a skill documents that cannot be installed here -------------
#
# The runner prints these when it sets up the skill, so the gap is visible in
# the test output rather than rediscovered each time.

[unavailable]
adaptyv-sdk = "adaptyv skill: distributed from GitHub only, not on PyPI"
torchdrug = "torchdrug skill: torch-scatter 2.1.2 sdist needs torch present at build time"
dgl = "molfeat skill: no cp313 wheels"
"flash-attn" = "esm skill: needs a CUDA toolchain to build"
"lilly-medchem-rules" = "medchem skill: conda-forge only; the Lilly demerit filter is optional"
