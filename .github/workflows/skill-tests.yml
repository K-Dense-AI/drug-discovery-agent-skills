name: Skill Tests

on:
  pull_request:
    paths:
      - "skills/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/skill-tests.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Repo-wide contract and coverage guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --python 3.13

      # tests/_meta checks every skill against the shared structural contract
      # (frontmatter, SKILL.md length, local links, scripts parse, no shipped
      # bytecode, no hardcoded local paths, ...) and enforces the repo rule that
      # a skill shipping scripts/ has a suite under tests/ and an entry in
      # tests/skill-requirements.toml. It imports no skill code and needs no
      # scientific packages, so it runs in seconds on every pull request.
      - name: Structural contract and coverage
        run: uv run --python 3.13 python -m pytest tests/_meta -q

  suites:
    name: Skill suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --python 3.13

      # Every suite, in the project environment, one process each. The heavy
      # scientific packages are absent here, so a suite that needs one degrades
      # to skips via its module-scope `pytest.importorskip` -- but its
      # standard-library tests still run, and a collection error, a syntax
      # error, or a broken import fails the build. Without this step only the
      # `packages = []` suites below ever execute in CI, which left five of
      # seven suites running nowhere but a manual --isolated sweep.
      - name: All suites, dependencies absent
        shell: bash
        run: |
          set -euo pipefail
          # One name per line into an array: passing a space-joined string
          # unquoted depends on IFS word-splitting, which run_all.py then sees
          # as a single unknown suite name. `while read` rather than `mapfile`
          # so the same snippet runs on the bash 3.2 that ships with macOS.
          SUITES=()
          while IFS= read -r suite; do SUITES+=("$suite"); done < <(python3 - <<'PY'
          import pathlib
          for path in sorted(pathlib.Path("tests").iterdir()):
              if path.is_dir() and not path.name.startswith((".", "_")):
                  print(path.name)
          PY
          )
          printf 'Suites: %s\n' "${SUITES[*]}"
          # Named explicitly so run_all.py does not re-run tests/_meta, which
          # the `contract` job above already gates on.
          uv run --python 3.13 python tests/run_all.py "${SUITES[@]}"

      # The skills whose bundled tooling is standard-library only -- read from
      # `packages = []` in tests/skill-requirements.toml, so the list needs no
      # separate maintenance. Each gets a clean throwaway environment, which is
      # what proves the entry is correct.
      #
      # The full `--isolated` sweep across every skill is deliberately NOT run
      # here: it builds one environment per skill including torch and deepchem,
      # and some need a CUDA toolchain CI does not have. Run it locally:
      #     python tests/run_all.py --isolated
      - name: Select standard-library-only skills
        id: select
        run: |
          set -euo pipefail
          SKILLS=$(python3 - <<'PY'
          import pathlib, tomllib
          manifest = tomllib.loads(
              pathlib.Path("tests/skill-requirements.toml").read_text()
          )
          names = sorted(
              name
              for name, entry in manifest["skills"].items()
              if not entry.get("packages") and "python" not in entry
              and (pathlib.Path("tests") / name).is_dir()
          )
          print(" ".join(names))
          PY
          )
          echo "Selected: $SKILLS"
          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"

      - name: Run standard-library-only suites, one environment each
        # An empty selection means no standard-library-only skills in this
        # repo; running run_all.py with no names would sweep every suite.
        if: steps.select.outputs.skills != ''
        run: uv run --python 3.13 python tests/run_all.py --isolated ${{ steps.select.outputs.skills }}
