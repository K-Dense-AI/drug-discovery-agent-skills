[project]
name = "drug-discovery-agent-skills"
version = "1.1.0"
description = "Agent Skills for small-molecule and protein therapeutics: cheminformatics, molecular ML, docking and dynamics, protein design platforms, and target-discovery knowledge graphs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Capped below the next major: scan_skills.py and scan_pr_skills.py drive
    # SkillScanner's private methods (see REQUIRED_SCANNER_API), which a major
    # release is free to rename. uv.lock pins the exact resolution for CI.
    "cisco-ai-skill-scanner>=2.0.12,<3",
    "firecrawl-py>=4.9.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Required: in prepend/append mode pytest puts tests/ on sys.path, which turns
# every tests/<skill>/ directory into an importable namespace package. Skills
# named after the library they wrap (neurokit2, simpy, qutip, ...) would then
# look installed to importlib.util.find_spec(). importlib mode touches sys.path
# not at all.
addopts = "--import-mode=importlib"
